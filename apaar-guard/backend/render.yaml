services:
  - type: web
    name: apaar-guard-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: APAAR Guard
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./apaar_guard.db
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
